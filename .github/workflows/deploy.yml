name: Deploy to GitHub Pages

# DRAFT MODE: deploys only when run by hand.
# To release: (1) rename repo back to wannita901.github.io and make it public,
# (2) Settings → Pages → Source: GitHub Actions, (3) change `on:` below to
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
