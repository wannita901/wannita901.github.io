name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "live = build and publish the site · down = publish the maintenance page"
        type: choice
        options: [live, down]
        default: live

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        if: inputs.mode != 'down'
        uses: withastro/action@v3
        with:
          node-version: 22
      - name: Package maintenance page
        if: inputs.mode == 'down'
        uses: actions/upload-pages-artifact@v3
        with:
          path: maintenance
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
